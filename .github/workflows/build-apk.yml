name: Build TaxiTicket APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: TaxiTicket-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TaxiTicket APK (latest)
          make_latest: true
          prerelease: false
          body: Public download of the latest TaxiTicket debug APK.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
