name: Build TaxiTicket APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaxiTicket-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: taxiticket-v0.1.${{ github.run_number }}
          name: TaxiTicket v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
